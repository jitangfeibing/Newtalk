[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newtalk-voiceprint"
version = "0.1.0"
description = "Independent speaker embedding service for Newtalk"
requires-python = ">=3.10,<3.13"
dependencies = [
    "asyncpg>=0.29,<1",
    "fastapi>=0.110,<1",
    "numpy>=1.26,<3",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
campplus = [
    "modelscope[datasets]>=1.13,<2",
    "soundfile>=0.12,<1",
    "torch>=2.2,<3",
    "torchaudio>=2.2,<3",
]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]

[project.scripts]
newtalk-voiceprint = "newtalk_voiceprint.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires the migrated PostgreSQL test database",
]
