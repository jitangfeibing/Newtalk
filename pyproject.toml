[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newtalk"
version = "0.7.0"
description = "Web-first multimodal companion runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.110,<1",
    "numpy>=1.26,<3",
    "onnxruntime>=1.16,<2",
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.29,<1",
    "websockets>=14,<18",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
]

[project.scripts]
newtalk = "newtalk.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: starts the real application server and uses network sockets",
    "live: calls a real external provider and is skipped unless explicitly enabled",
]
