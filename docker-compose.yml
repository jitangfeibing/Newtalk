services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: newtalk
      POSTGRES_USER: newtalk
      POSTGRES_PASSWORD: newtalk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newtalk -d newtalk"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - newtalk-postgres:/var/lib/postgresql/data

volumes:
  newtalk-postgres:
