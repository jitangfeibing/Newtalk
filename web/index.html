<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Newtalk Voice Console</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="shell">
        <header class="masthead">
            <div>
                <p class="eyebrow">NEWTALK / PART 05</p>
                <h1>Voice Console</h1>
            </div>
            <div class="status" data-state="offline" id="connectionStatus">
                <span class="status-dot"></span>
                <span id="statusLabel">离线</span>
            </div>
        </header>

        <section class="hero">
            <p class="hero-index">01</p>
            <div>
                <h2>文字流动，<br>声音随行。</h2>
                <p class="hero-copy">
                    当前页面验证麦克风 PCM、Silero VAD、语音 Turn、流式 LLM/TTS 与打断。
                    P5 先使用 Fake ASR 固定文本，真实流式 ASR 在链路稳定后接入。
                </p>
            </div>
        </section>

        <div class="workspace">
            <section class="chat-panel" aria-labelledby="chatTitle">
                <header class="panel-header">
                    <div>
                        <span class="label">STREAMING CHAT</span>
                        <h3 id="chatTitle">文本对话</h3>
                    </div>
                    <div class="runtime-badges">
                        <span class="model-badge">LLM STREAM</span>
                        <span class="mic-badge" data-state="idle" id="micStatus">麦克风待命</span>
                        <span class="audio-badge" data-state="idle" id="audioStatus">音频待命</span>
                    </div>
                </header>

                <ol class="message-list" id="messageList" aria-live="polite"></ol>

                <form class="composer" id="chatForm">
                    <label class="sr-only" for="messageInput">输入聊天内容</label>
                    <textarea
                        id="messageInput"
                        maxlength="4000"
                        placeholder="输入消息，Enter 发送，Shift + Enter 换行"
                        rows="2"
                    ></textarea>
                    <div class="composer-footer">
                        <span>最多 4000 字符 · PCM 低延迟播放</span>
                        <div class="composer-actions">
                            <button type="button" class="button secondary" id="micButton" disabled>开启麦克风</button>
                            <button type="button" class="button secondary" id="stopAudioButton" disabled>停止播放</button>
                            <button type="submit" class="button send-button" id="sendButton" disabled>发送消息</button>
                        </div>
                    </div>
                </form>
            </section>

            <section class="console-panel">
                <div class="console-toolbar">
                    <div>
                        <span class="label">ENDPOINT</span>
                        <code id="endpoint">等待页面初始化</code>
                    </div>
                    <div class="actions">
                        <button type="button" class="button secondary" id="pingButton" disabled>Ping</button>
                        <button type="button" class="button" id="connectionButton">连接</button>
                    </div>
                </div>
                <ol class="event-log" id="eventLog" aria-live="polite"></ol>
            </section>
        </div>
    </main>

    <script type="module" src="/app.js"></script>
</body>
</html>
